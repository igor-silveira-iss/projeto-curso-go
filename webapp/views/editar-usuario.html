<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBook - Editar Usuário</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.css" />
</head>

<body>

    {{ template "cabecalho" }}

    <div class="container-fluid">
        <div class="row mt-4">
            <div class="col-12">
                <h3>Editar Dados</h3>
                <form id="editar-usuario">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input class="form-control" type="text" name="nome" id="nome" placeholder="Insira o seu nome"
                            value="{{ .Nome }}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input class="form-control" type="text" name="email" id="email" placeholder="Insira o seu e-mail"
                            value="{{ .Email }}" required>
                    </div>
                    <div class="form-group">
                        <label for="nick">Nick</label>
                        <input class="form-control" type="text" name="nick" id="nick" placeholder="Insira o seu nick"
                            value="{{ .Nick }}" required>
                    </div>
                    <button type="submit" class="btn btn-info">Atualizar Dados</button>
                </form>
            </div>
        </div>
    </div>

    {{ template "rodape"}}
    {{ template "scripts" }}
    <script src="/assets/js/usuario.js"></script>
</body>

</html>
